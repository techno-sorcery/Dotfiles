- name: Install cli extras
  become: true
  apt:
    name: "{{ cli_extras_packages }}"
    state: present
    update_cache: true
  tags:
    - extras

- name: Stow cli extras
  shell: "stow -d {{ playbook_dir }}/../config -t ~/ -v --adopt {{ item }}"
  loop: "{{ cli_extras_stow }}"
  tags:
    - extras

- name: Make newsboat data dir
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/newsboat"
    state: directory
    mode: 0755

- name: Update /etc/orpierc
  become: true
  copy:
    src: "{{ playbook_dir }}/../assets/orpierc"
    dest: /etc
    force: true
